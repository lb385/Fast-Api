<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FastAPI Calculator</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }
      .container {
        max-width: 560px;
        margin: 50px auto;
        background: #1e293b;
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      }
      h1 {
        margin-top: 0;
      }
      .row {
        display: flex;
        gap: 12px;
        margin-bottom: 12px;
      }
      input,
      select,
      button {
        width: 100%;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #334155;
        background: #0f172a;
        color: #e2e8f0;
      }
      button {
        background: #2563eb;
        cursor: pointer;
        border: none;
      }
      #result,
      #error {
        margin-top: 14px;
        font-weight: bold;
      }
      #error {
        color: #f87171;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <h1>FastAPI Calculator</h1>
      <div class="row">
        <input id="a" type="number" placeholder="Enter first number" />
        <input id="b" type="number" placeholder="Enter second number" />
      </div>
      <div class="row">
        <select id="operation">
          <option value="add">Add (+)</option>
          <option value="subtract">Subtract (-)</option>
          <option value="multiply">Multiply (×)</option>
          <option value="divide">Divide (÷)</option>
        </select>
      </div>
      <button id="calculate" type="button">Calculate</button>
      <p id="result"></p>
      <p id="error"></p>
    </main>

    <script>
      const btn = document.getElementById('calculate');
      const aInput = document.getElementById('a');
      const bInput = document.getElementById('b');
      const operationInput = document.getElementById('operation');
      const resultEl = document.getElementById('result');
      const errorEl = document.getElementById('error');

      btn.addEventListener('click', async () => {
        resultEl.textContent = '';
        errorEl.textContent = '';

        const payload = {
          a: Number(aInput.value),
          b: Number(bInput.value)
        };

        try {
          const response = await fetch(`/${operationInput.value}`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
          });

          const data = await response.json();

          if (!response.ok) {
            errorEl.textContent = data.detail || 'Something went wrong';
            return;
          }

          resultEl.textContent = `Result: ${data.result}`;
        } catch (error) {
          errorEl.textContent = 'Network error. Please try again.';
        }
      });
    </script>
  </body>
</html>
